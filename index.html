<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="曼谷行程">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>逃離現實計畫｜曼谷篇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Semi+Condensed:wght@500;600;700&family=Anton&display=swap">
<style>
/* Layout: 3D map stage with map-style controls (top-left view mode, top-right legend, right rail zoom/compass, bottom playback bar);
   itinerary timeline on the right, stacked under the map on phones. Single dark look by choice. */
:root{
  /* night-transit palette: indigo night, saffron pin, teal for "home" */
  --night:#070809; --deck:#0d0e10; --deck-2:#1a1c20; --deck-3:#2a2d33; --rule:#25282d; --rule-2:#3b4048;
  --ink:#f5f5f2; --mute:#a0a5ad; --pin:#f2c230; --pin-ink:#141004; --hotel:#6fd66f;
  --glass:rgba(6,7,9,.8);
  --f-disp:"Anton","Barlow Semi Condensed","Noto Sans TC",sans-serif;
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-data:"Barlow Semi Condensed","Noto Sans TC",system-ui,sans-serif;
  --r-panel:2px; --r-ctl:2px;
  --tap:40px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--pin);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr)}

/* header + day tabs */
header{grid-column:1/-1;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--rule);background:var(--deck)}
h1{margin:0;font-size:18px;font-weight:900;letter-spacing:.01em;white-space:nowrap;display:flex;align-items:baseline;gap:10px}
h1 small{font-family:var(--f-data);font-weight:600;font-size:12.5px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase}
.daynav{display:flex;align-items:center;gap:6px;flex:1 1 320px;min-width:0}
.days{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto;padding:3px;background:var(--deck-2);border-radius:var(--r-panel)}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:60px;min-height:var(--tap);
  color:var(--mute);background:transparent;border:0;border-radius:9px;padding:3px 10px;cursor:pointer;transition:background .15s,color .15s}
.days button b{font:600 16px/1.1 var(--f-data);letter-spacing:.02em;color:inherit;font-variant-numeric:tabular-nums}
.days button span{font-size:11px;line-height:1.2}
.days button:hover{color:var(--ink);background:var(--deck-3)}
.days button[aria-pressed="true"]{color:var(--pin-ink);background:var(--pin);box-shadow:0 2px 10px rgba(242,194,48,.35)}
.step{flex:0 0 auto;width:var(--tap);height:var(--tap);display:grid;place-items:center;color:var(--ink);background:var(--deck-2);border:0;border-radius:var(--r-ctl);cursor:pointer;font-size:18px;transition:background .15s}
.step:hover{background:var(--deck-3)}
.step:disabled{opacity:.35;cursor:default}

/* stage */
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:grab}
#gl:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 95% at 50% 42%,transparent 58%,rgba(4,6,12,.5));transition:opacity .4s}
.stage.lite .vig{background:radial-gradient(120% 95% at 50% 42%,transparent 62%,rgba(90,115,140,.16))}

/* map labels */
.lb{position:absolute;transform:translate(-50%,-100%);margin-top:-6px;white-space:nowrap}
.lb a{display:inline-flex;align-items:center;gap:6px;pointer-events:auto;cursor:pointer;text-decoration:none;
  background:var(--glass);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px 10px 3px 3px;
  font-size:12.5px;font-weight:700;line-height:1;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.lb a:hover{border-color:var(--pin)}
.lb b{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;
  background:var(--pin);color:var(--pin-ink);font:700 13px/1 var(--f-data);padding:0 5px}
.lb i{font-style:normal;font-family:var(--f-data);font-weight:500;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.stage.lite .lb a{background:rgba(255,255,255,.96);color:#13202e;border-color:rgba(10,20,30,.16);box-shadow:0 2px 8px rgba(20,40,60,.2)}
.stage.lite .lb i{color:#51607a}
.hl{position:absolute;transform:translate(-50%,-100%);margin-top:-4px;white-space:nowrap;pointer-events:auto;font:900 13px/1 var(--f-body);color:#04201b;
  background:var(--hotel);padding:7px 10px;border-radius:8px;box-shadow:0 0 0 2px rgba(13,18,24,.9),0 0 18px rgba(111,214,111,.55)}
.hl a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.hl::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--hotel)}
.hl small{font:600 13px/1 var(--f-data);opacity:.75}
.hl b{background:#04201b;color:var(--hotel);border-radius:9px;padding:2px 6px;font:700 12.5px/1 var(--f-data)}
.tt{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:700 13px/1 var(--f-data);letter-spacing:.02em;color:#0b1018;
  padding:4px 9px 5px;border-radius:999px;box-shadow:0 0 0 2px rgba(10,14,23,.85),0 3px 8px rgba(0,0,0,.3)}
.tt.ghost{opacity:.65}
.tt.on{box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(13,18,24,.85)}
.stage.lite .tt{box-shadow:0 0 0 2px #fff,0 3px 8px rgba(20,40,60,.25)}
.stage.lite .tt.on{box-shadow:0 0 0 2px #fff,0 0 0 4px #13202e}
.st{position:absolute;transform:translate(-50%,-50%);font:600 12px/1 var(--f-data);letter-spacing:.03em;color:#c9d2de;
  text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap}
.stage.lite .st{color:#1f2a38;text-shadow:0 0 3px #fff,0 0 6px #fff}
.rd{position:absolute;transform:translate(-50%,-50%);font:500 11.5px/1 var(--f-data);color:#6f7d93;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 2px #000}
.stage.lite .rd{color:#7a8797;text-shadow:0 0 3px #fff}

/* overlays share one glass surface */
.glass{background:var(--glass);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-panel);box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);-webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2)}
.seg{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;display:flex;overflow:hidden;padding:3px;gap:2px}
.seg button{min-height:34px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--mute);font:600 13px/1 var(--f-body);cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
.legend{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;font-size:12.5px;color:var(--ink);max-width:min(240px,60%)}
.legend summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px;padding:0 12px;
  font:600 12px/1 var(--f-body);color:var(--mute)}
.legend summary::-webkit-details-marker{display:none}
.legend summary::after{content:"▾";font-size:11px}
.legend[open] summary::after{content:"▴"}
.legend .items{display:grid;gap:7px;padding:2px 12px 12px}
.legend .items span{display:flex;align-items:center;gap:9px}
.legend em{display:inline-block;flex:0 0 26px;height:5px;border-radius:3px}
.tog{display:flex;align-items:center;gap:9px;min-height:38px;padding:0 12px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:var(--ink);cursor:pointer}
.tog input{width:16px;height:16px;margin:0;accent-color:var(--pin);cursor:pointer}
.rail{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:76px;display:flex;flex-direction:column;gap:8px;align-items:center}
.rail .grp{display:flex;flex-direction:column;overflow:hidden}
.rail button{width:var(--tap);height:var(--tap);display:grid;place-items:center;border:0;background:transparent;color:var(--ink);cursor:pointer;font:600 20px/1 var(--f-data);transition:background .15s}
.rail button:hover{background:var(--deck-3)}
.rail .grp button+button{border-top:1px solid rgba(255,255,255,.08)}
.rail svg{width:20px;height:20px;display:block}
.compass{border-radius:50%!important;width:46px!important;height:46px!important;padding:0}
.compass svg{width:100%;height:100%}
.bar{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:12px;
  display:flex;align-items:center;gap:14px;padding:4px 14px 4px 8px}
.bar .pp{flex:0 0 auto;width:var(--tap);height:var(--tap);display:grid;place-items:center;border:0;border-radius:50%;background:var(--pin);color:var(--pin-ink);cursor:pointer;box-shadow:0 2px 10px rgba(242,194,48,.35);transition:transform .12s}
.bar .pp:hover{transform:scale(1.06)}
.bar .pp svg{width:18px;height:18px}
.bar input[type=range]{--p:0%;position:relative;z-index:1;display:block;width:100%;height:var(--tap);margin:0;cursor:pointer;background:transparent;-webkit-appearance:none;appearance:none}
.scrubwrap{position:relative;flex:1 1 120px;min-width:80px}
.ticks{position:absolute;left:8px;right:8px;top:50%;height:0;pointer-events:none;z-index:2}
.ticks i{position:absolute;top:-5px;width:2px;height:10px;margin-left:-1px;border-radius:1px;background:rgba(255,255,255,.55)}
.ticks i.stopt{top:-4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--deck);box-shadow:0 0 0 2px var(--pin)}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--pin) var(--p),var(--deck-3) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--pin) var(--p),var(--deck-3) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 3px rgba(242,194,48,.45),0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 3px rgba(242,194,48,.45),0 2px 6px rgba(0,0,0,.4)}
.status{flex:0 1 auto;min-width:0;max-width:46%;font:600 14.5px/1.3 var(--f-data);letter-spacing:.02em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;font-variant-numeric:tabular-nums}
.status span{color:var(--mute);font-weight:500}
.fchip{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;max-width:calc(100% - 24px);
  font-size:13px;font-weight:700;border-color:rgba(242,194,48,.7)}
.fchip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip button{flex:0 0 auto;min-height:32px;padding:0 12px;border:0;border-radius:9px;background:var(--deck-3);color:var(--ink);font:600 12.5px/1 var(--f-body);cursor:pointer;transition:background .15s,color .15s}
.fchip button:hover{background:var(--pin);color:var(--night)}
.help{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:76px;width:min(300px,calc(100% - 84px));padding:14px 14px 12px;font-size:13px}
.help h2{margin:0 0 8px;font-size:14px;font-weight:900}
.help dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.help dt{font:600 13.5px/1.5 var(--f-data);letter-spacing:.02em;color:var(--pin);white-space:nowrap}
.help dd{margin:0;color:var(--ink)}
.help .ok{margin-top:12px;width:100%;min-height:36px;border:0;border-radius:var(--r-ctl);background:var(--ink);color:var(--night);font:700 13px/1 var(--f-body);cursor:pointer}
.help dl.touch-only{display:none}
@media (hover:none){.help dl.mouse-only{display:none}.help dl.touch-only{display:grid}}

/* itinerary panel */
aside{border-left:1px solid var(--rule);background:var(--deck);overflow-y:auto;min-width:0;scrollbar-width:thin;
  padding-bottom:24px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.phead{position:sticky;top:0;z-index:2;background:linear-gradient(var(--deck) 88%,transparent);padding:16px 0 14px;margin-bottom:6px}
.dt{font-size:22px;font-weight:900;line-height:1.25;margin:0;text-wrap:balance;letter-spacing:.01em}
.dt small{display:block;font:600 13.5px/1.2 var(--f-data);letter-spacing:.12em;color:var(--pin);margin:0 0 4px}
.ds{color:var(--mute);font-size:13px;margin:4px 0 14px}
.stats{display:flex;margin:0;padding:10px 0;border-block:1px solid var(--rule)}
.stats div{flex:1 1 0;min-width:0;padding:0 12px;border-left:1px solid var(--rule)}
.stats div:first-child{padding-left:0;border-left:0}
.stats dt{font-size:11.5px;color:var(--mute);line-height:1.2}
.stats dd{margin:3px 0 0;font:600 22px/1.1 var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.stats dd small{font:400 11.5px/1 var(--f-body);color:var(--mute);margin:0 3px 0 2px}
ol.tl{list-style:none;margin:0;padding:0;position:relative}
ol.tl::before{content:"";position:absolute;left:62px;top:14px;bottom:14px;width:2px;border-radius:1px;background:var(--rule)}
.tl li{display:grid;grid-template-columns:42px 26px minmax(0,1fr);column-gap:8px;align-items:start;position:relative}
.tm{font:600 15px/26px var(--f-data);letter-spacing:.02em;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.n{width:26px;height:26px;border-radius:13px;background:var(--pin);color:var(--pin-ink);font:700 14px/26px var(--f-data);text-align:center;position:relative;z-index:1;box-shadow:0 0 0 3px var(--deck)}
.home .n{background:var(--hotel)}
.stopbody{padding:0 0 6px;min-width:0}
.stoprow{display:flex;align-items:flex-start;gap:6px}
.stopbtn{flex:1 1 auto;min-width:0;text-align:left;border:0;background:transparent;color:var(--ink);font:700 15.5px/1.35 var(--f-body);padding:2px 6px;margin:0 0 0 -6px;border-radius:6px;cursor:pointer;transition:background .15s}
.stopbtn:hover,.stopbtn.on{background:var(--deck-2)}
.stopbtn.on{box-shadow:inset 0 0 0 1px var(--pin)}
.gm{flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;min-height:28px;padding:0 8px;border:1px solid var(--rule-2);border-radius:999px;color:var(--mute);font-size:12px;text-decoration:none;white-space:nowrap;transition:color .15s,border-color .15s}
.gm:hover{color:var(--pin);border-color:var(--pin)}
.note{font-size:12.5px;color:var(--mute);padding-left:0}
.legdot{justify-self:center;width:10px;height:10px;border-radius:5px;background:var(--m,var(--rule-2));margin-top:16px;position:relative;z-index:1;box-shadow:0 0 0 3px var(--deck);opacity:.55;transition:opacity .2s,transform .2s}
.live .legdot{opacity:1;transform:scale(1.25);box-shadow:0 0 0 3px var(--deck),0 0 0 5px color-mix(in srgb,var(--m,var(--pin)) 40%,transparent)}
.leg{display:block;width:100%;text-align:left;margin:2px 0 8px;padding:8px 10px;border:1px solid transparent;border-radius:10px;
  background:transparent;color:var(--mute);font:400 13px/1.5 var(--f-body);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.leg:hover{background:var(--deck-2);color:var(--ink)}
.leg.on{background:var(--deck-2);color:var(--ink);border-color:rgba(242,194,48,.7)}
.live .leg{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:3px}
.chip{font:700 12.5px/1 var(--f-data);padding:3px 7px 4px;border-radius:5px;color:#0b1018;letter-spacing:.03em}
.mins{font:600 14px/1 var(--f-data);color:var(--ink);margin-left:5px;font-variant-numeric:tabular-nums}
.ghostleg .leg{font-size:12.5px}

@media (max-width:860px){
  :root{--tap:44px}
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto}
  h1 small{display:none}
  .stage{height:64svh;min-height:380px}
  aside{border-left:0;border-top:1px solid var(--rule);padding-left:max(16px,env(safe-area-inset-left,0px));overflow:visible}
  .phead{position:static}
  .status{max-width:none;flex:1 1 100%;order:3;text-align:left;padding:0 6px 2px}
  .bar{flex-wrap:wrap;row-gap:0}
  .rail{bottom:104px}
  .help{bottom:104px}
  .fchip{top:60px}
  .seg button{padding:0 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@supports not (backdrop-filter:blur(1px)){.glass{background:rgba(13,18,29,.94)}}

/* ---- open-world game HUD skin: black panels, yellow objective blips, green safehouse, radar, mission banner ---- */
#gl{filter:contrast(1.07) saturate(1.14)}
.vig,.stage.lite .vig{background:radial-gradient(115% 90% at 50% 45%,transparent 52%,rgba(0,0,0,.55))}
header{background:#000;border-bottom:0}
h1 small{font:400 14px/1 var(--f-disp);color:var(--pin);letter-spacing:.14em}
.days{background:transparent;padding:0;border-radius:0}
.days button{border-radius:0;background:rgba(255,255,255,.08);border-top:3px solid transparent;min-width:64px}
.days button b{font:400 17px/1.15 var(--f-disp);letter-spacing:.04em}
.days button[aria-pressed="true"]{background:#fff;color:#000;border-top-color:var(--pin);box-shadow:none}
.step{background:rgba(255,255,255,.08)}
.hud{flex:0 0 auto;margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-family:var(--f-disp);line-height:1;white-space:nowrap}
.stars{font-size:17px;letter-spacing:2px;color:rgba(255,255,255,.24)}
.stars b{color:#fff;font-weight:400}
.clock{font-size:19px;letter-spacing:.06em;color:var(--hotel)}
.glass{border:0;box-shadow:0 6px 20px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.seg button{border-radius:0}
.seg button[aria-pressed="true"]{background:#fff;color:#000}
.legend summary{font:400 13px/1 var(--f-disp);letter-spacing:.08em;color:#fff}
.lb a,.stage.lite .lb a{background:rgba(0,0,0,.86);border:0;border-radius:2px;color:#fff;padding:3px 9px 3px 3px;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 3px 10px rgba(0,0,0,.5)}
.lb a:hover,.stage.lite .lb a:hover{box-shadow:0 0 0 2px var(--pin)}
.lb b{border-radius:2px;min-width:22px;height:22px;font:400 14px/1 var(--f-disp)}
.lb i,.stage.lite .lb i{color:#c9cdd3}
.hl{border-radius:2px;box-shadow:0 0 0 2px #000,0 0 18px rgba(111,214,111,.55)}
.hl b{border-radius:2px}
.tt,.stage.lite .tt{border-radius:2px;box-shadow:0 0 0 2px #000,0 3px 8px rgba(0,0,0,.4)}
.tt.on,.stage.lite .tt.on{box-shadow:0 0 0 2px #fff,0 0 0 4px #000}
.st.sg,.stage.lite .st.sg{color:#dccbff;font-weight:600}
.st,.stage.lite .st{color:#fff;text-shadow:0 0 2px #000,0 1px 3px #000,0 0 6px #000}
.rd,.stage.lite .rd{color:rgba(255,255,255,.7);text-shadow:0 1px 2px #000,0 0 4px #000}
.ticks i.stopt{border-radius:1px;transform:rotate(45deg)}
.status{font:400 15px/1.3 var(--f-disp);letter-spacing:.05em}
.status span{font-family:var(--f-data);font-weight:500;letter-spacing:.02em}
/* fixed-width status so the scrubber keeps one length whatever the text */
@media (min-width:861px){.status{flex:0 0 clamp(260px,36%,380px);max-width:none;text-align:left}}
.fchip{border:0;box-shadow:0 0 0 2px var(--pin),0 6px 20px rgba(0,0,0,.5)}
.fchip button,.stopbtn,.leg,.chip,.help .ok{border-radius:2px}

.help h2{font:400 16px/1.2 var(--f-disp);letter-spacing:.08em;color:var(--pin)}

.osm{padding:0 12px 9px;font-size:11.5px;color:var(--mute)}
/* radar */
.radar{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:88px;width:204px;height:136px;box-sizing:border-box;border:2px solid #000;
  box-shadow:0 0 0 1px rgba(255,255,255,.18),0 8px 22px rgba(0,0,0,.55),inset 0 0 26px rgba(0,0,0,.45);pointer-events:none}
.radar .n{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;background:#000;color:#fff;font:400 12px/18px var(--f-disp);text-align:center;border-radius:2px;box-shadow:none}
.radar .rbar{position:absolute;left:-2px;right:-2px;bottom:-11px;height:7px;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.radar .rbar i{display:block;height:100%;width:0;background:var(--hotel);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
/* objectives panel */
aside{border-left:0}
.dt small{font:400 15px/1.2 var(--f-disp);letter-spacing:.14em}
.stats dd{font:400 23px/1.1 var(--f-disp);letter-spacing:.02em}
.tm{font:400 16px/26px var(--f-disp);letter-spacing:.03em}
ol.tl .n{border-radius:2px;font:400 15px/26px var(--f-disp)}
.legdot{border-radius:1px;transform:rotate(45deg)}
.live .legdot{transform:rotate(45deg) scale(1.25)}
.gm{border-radius:2px}
@media (max-width:860px){
  .daynav{order:3;flex-basis:100%}
  .hud{flex-direction:row;align-items:center;gap:10px}
  .stars{font-size:14px;letter-spacing:1px}.clock{font-size:16px}
  .radar{width:128px;height:88px;bottom:118px}
  .help{top:62px;bottom:auto}
  .fchip{top:62px}
}

/* itinerary table dialog */
.itbtn{flex:0 0 auto;min-height:var(--tap);padding:0 16px;border:0;border-radius:2px;background:var(--pin);color:var(--pin-ink);font:700 14px/1 var(--f-body);cursor:pointer}
.itbtn:hover{filter:brightness(1.1)}
dialog.it{width:min(1180px,96vw);height:min(88vh,900px);padding:0;border:0;border-radius:2px;background:#0d0e10;color:var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.14),0 30px 80px rgba(0,0,0,.7);overflow:hidden}
dialog.it[open]{display:flex;flex-direction:column}
dialog.it::backdrop{background:rgba(0,0,0,.66)}
.ithead{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#000}
.ithead h2{margin:0;font:900 18px/1.2 var(--f-body)}
.ithead .x{margin-left:auto;width:var(--tap);height:var(--tap);border:0;border-radius:2px;background:rgba(255,255,255,.08);color:#fff;font:400 22px/1 var(--f-body);cursor:pointer}
.ittabs{flex:0 0 auto;display:flex;gap:2px;padding:0 16px 10px;background:#000;overflow-x:auto}
.ittabs button{flex:0 0 auto;min-height:38px;padding:0 13px;border:0;border-top:3px solid transparent;background:rgba(255,255,255,.08);color:var(--ink);font:400 15px/1 var(--f-disp);letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.ittabs button[aria-pressed="true"]{background:#fff;color:#000;border-top-color:var(--pin)}
.itwrap{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch}
table.itt{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.55}
.itt th{position:sticky;top:0;z-index:1;background:#16181b;color:var(--mute);font:600 12px/1.2 var(--f-body);text-align:left;padding:9px 10px;white-space:nowrap}
.itt td{padding:9px 10px;border-top:1px solid var(--rule);vertical-align:top}
.itt tr.dayrow td{background:#1a1c20;border-top:2px solid var(--pin);font:400 16px/1.2 var(--f-disp);letter-spacing:.08em;color:var(--pin);padding:9px 10px}
.itt .t{white-space:nowrap;font:400 15px/1.5 var(--f-disp);letter-spacing:.03em}
.itt .nm{font-weight:700;min-width:9em}
.itt .ds{white-space:pre-line;color:#d5d8dd;min-width:17em}
.itt .gr{color:var(--mute);font-size:12.5px;min-width:11em}
.itt .sta{white-space:nowrap;font-size:12.5px}
.itt .sta.ok{color:var(--hotel);font-weight:700}
.itt .cat{display:inline-block;padding:1px 7px;border-radius:2px;font-size:12px;font-weight:700;white-space:nowrap;color:#111}
.itt a{color:var(--pin);white-space:nowrap}
@media (max-width:760px){
  dialog.it{width:100vw;height:100dvh;max-width:none;max-height:none}
  .itt thead{display:none}
  .itt,.itt tbody,.itt tr,.itt td{display:block}
  .itt tr{padding:10px 14px;border-top:1px solid var(--rule)}
  .itt tr.dayrow{padding:0}
  .itt tr.dayrow td{padding:9px 14px}
  .itt td{padding:1px 0;border:0;min-width:0!important}
  .itt td:empty{display:none}
  .itt .gr::before{content:"Grab：";}
}

.ithead{flex-wrap:wrap}
.itviews{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.itviews button{flex:0 0 auto;min-height:38px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--mute);font:700 14px/1 var(--f-body);cursor:pointer;white-space:nowrap}
.itviews button[aria-pressed="true"]{color:#fff;border-bottom-color:var(--pin)}
.ittabs[hidden]{display:none}
dialog.it:focus{outline:none}
.itviews button:focus-visible,.ittabs button:focus-visible{outline-offset:-3px}
.calg{display:grid;grid-template-columns:52px repeat(7,minmax(118px,1fr));grid-template-rows:44px repeat(17,46px);min-width:880px;padding:0 12px 4px}
.ch{position:sticky;top:0;z-index:2;background:#0d0e10;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;color:var(--mute);border-bottom:2px solid var(--pin)}
.ch b{font:400 17px/1.1 var(--f-disp);color:#fff;letter-spacing:.04em}
.chr{font:400 13px/1 var(--f-disp);color:var(--mute);text-align:right;padding:4px 8px 0 0;border-top:1px solid var(--rule)}
.cc{border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.cev{z-index:1;margin:2px 2px 2px 3px;padding:4px 7px;border:0;border-radius:2px;color:#111;text-align:center;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:1px;font-family:var(--f-body)}
.cev b{font-size:12.5px;line-height:1.25}
.cev span{font-size:10.5px;line-height:1.2;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cev:hover,.cev.on{box-shadow:0 0 0 2px #fff}
.cleg{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 16px;font-size:12.5px;color:var(--mute);position:sticky;left:0}
.cleg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cleg em{font-style:normal;margin-left:auto}
.cnote{position:sticky;left:0;bottom:0;z-index:3;margin:0;padding:12px 16px;background:#16181b;border-top:2px solid var(--pin);font-size:13.5px;line-height:1.6;display:flex;flex-direction:column;gap:4px}
.cnote[hidden]{display:none}
.cnote span{white-space:pre-line;color:#d5d8dd}
.cnote a,.doc a{color:var(--pin)}
.doc{max-width:980px;margin:0 auto;padding:6px 18px 28px;font-size:14px;line-height:1.7}
.doc .lead{color:var(--mute);margin:12px 0}
.doc h3{margin:26px 0 10px;font:900 17px/1.3 var(--f-body);color:var(--pin)}
.doc h3.sec{padding-top:14px;border-top:1px solid var(--rule-2)}
.doc h4{margin:18px 0 6px;font:700 14.5px/1.3 var(--f-body)}
.doc p{margin:8px 0;color:#d5d8dd}
.doc ul{margin:8px 0;padding-left:1.3em}
.doc li{margin:5px 0}
.doc li.li2{margin-left:1.4em;list-style:circle;color:#d5d8dd}
.chks{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:2px;cursor:pointer}
.chk:hover{background:rgba(255,255,255,.05)}
.chk input{flex:0 0 auto;width:18px;height:18px;margin:3px 0 0;accent-color:var(--pin)}
.chk input:checked+span{color:var(--mute);text-decoration:line-through}
.tw{overflow-x:auto;margin:10px 0}
.itt.nt th{position:static}
.itt.nt td{min-width:7em}
@media (max-width:760px){
  .itt.nt td{min-width:0}
  .ithead{padding-bottom:4px}
  .itviews{order:3;flex-basis:100%}
  .itt.nt td:nth-child(n+2){color:#c9cdd3;font-size:13px}
  .doc{padding:4px 14px 24px}
  .doc .tw{margin:6px -14px}
}

/* installed-to-home-screen (standalone) safe areas: keep content out from under the phone status bar / home indicator */
header{padding-top:calc(8px + env(safe-area-inset-top,0px) * 1.4)}
h1{font-size:21px}
@media (max-width:480px){.stars{display:none}}
.stage .itbtn{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;z-index:3;box-shadow:0 0 0 2px #000,0 6px 18px rgba(0,0,0,.5)}
aside{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
@media (max-width:760px){.ithead{padding-top:calc(10px + env(safe-area-inset-top,0px) * 1.4)}.itwrap{padding-bottom:env(safe-area-inset-bottom,0px)}}

        <svg viewBox="0 0 64 64" aria-hidden="true"><g id="rose">
          <path d="M32 9 L39 32 L32 28 L25 32 Z" fill="#ff5a4f"/>
          <path d="M32 55 L39 32 L32 36 L25 32 Z" fill="#c9d1db"/>
        </g></svg>
      </button>
      <div class="grp glass">
        <button id="zin" type="button" title="放大" aria-label="放大">+</button>
        <button id="zout" type="button" title="縮小" aria-label="縮小">−</button>

    </div>
    <div class="help glass" id="help" hidden>
      <h2>怎麼操作</h2>
      <dl class="mouse-only">
        <dt>左鍵拖曳</dt><dd>旋轉視角</dd>
        <dt>按住滾輪拖曳</dt><dd>平移地圖（右鍵也可以）</dd>
        <dt>滾動滾輪</dt><dd>縮放</dd>
        <dt>← →</dt><dd>換前一天、後一天</dd>
        <dt>空白鍵</dt><dd>讓箭頭自動沿路線走，再按一次停止</dd>
        <dt>Esc</dt><dd>取消聚焦，顯示全部</dd>
      </dl>
      <dl class="touch-only">
        <dt>單指拖曳</dt><dd>旋轉視角</dd>
        <dt>雙指拖曳</dt><dd>平移地圖</dd>
        <dt>雙指開合</dt><dd>縮放</dd>
      </dl>
      <dl style="margin-top:6px">
        <dt>點行程</dt><dd>鏡頭飛到那個地點或那段交通</dd>
        <dt>點地標標籤</dt><dd>開啟 Google 地圖</dd>
      </dl>
      <button class="ok" id="helpOk" type="button">知道了</button>
    </div>
    <button type="button" class="itbtn" id="itBtn" aria-haspopup="dialog">行程表</button>
    <div class="bar glass">
      <div class="scrubwrap"><input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="當天路線進度"><div class="ticks" id="ticks" aria-hidden="true"></div></div>
      <div class="status" id="status">--</div>
    </div>
  </div>
  <aside id="list"></aside>
</div>

</dialog>

     else if(b.k==='table')h+=`<div class="tw"><table class="itt nt"><thead><tr>${b.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((x,i)=>`<td${i===0?' class="nm"':''}>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;});
   close();return h+'</div>';}
 function draw(){
   views.innerHTML=VIEWS.map(v=>`<button type="button" data-v="${v[0]}" aria-pressed="${view===v[0]}">${v[1]}</button>`).join('');
   tabs.hidden=view!=='list';
   if(view==='list')tabs.innerHTML=['全部',...dates].map((d,i)=>`<button type="button" data-i="${i-1}" aria-pressed="${sel===i-1}">${esc(d)}</button>`).join('');
   pane.innerHTML=view==='list'?vList():view==='cal'?vCal():view==='flex'?vFlex():vNotes();pane.scrollTop=0;pane.scrollLeft=0;}
 views.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;draw();});
 tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sel=+b.dataset.i;draw();});
 pane.addEventListener('click',e=>{const b=e.target.closest('.cev');if(!b)return;const ev=XTRA.cal.ev[+b.dataset.k],n=document.getElementById('cNote');
   pane.querySelectorAll('.cev.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');
   const d=XTRA.cal.days[ev[0]],lines=ev[6].split('\n').filter((x,i)=>!(i===0&&x.trim()===ev[3]));
   n.innerHTML=`<b>${esc(d[0])} ${esc(d[1])}　${String(ev[1]).padStart(2,'0')}:00–${String(ev[1]+ev[2]).padStart(2,'0')}:00　${esc(ev[3])}</b><span>${esc(lines.join('\n').replace(/・/g,'\n'))}</span>${mapA(ev[7])}`;n.hidden=false;});
 pane.addEventListener('change',e=>{const c=e.target;if(!c.matches('.chk input'))return;try{const d=JSON.parse(localStorage.getItem('bkk3dTodo')||'{}')||{};d[c.dataset.id]=c.checked?1:0;localStorage.setItem('bkk3dTodo',JSON.stringify(d));}catch(er){}});
 document.getElementById('itBtn').addEventListener('click',()=>{sel=curDay;draw();dlg.showModal();dlg.focus();});
 document.getElementById('itClose').addEventListener('click',()=>dlg.close());
 dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('itDlg').open)return;
  if(e.altKey||e.ctrlKey||e.metaKey)return;const tg=e.target,tag=tg&&tg.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(e.key==='ArrowLeft'){if(curDay>0)build(curDay-1);e.preventDefault();}
  else if(e.key==='ArrowRight'){if(curDay<DAYS.length-1)build(curDay+1);e.preventDefault();}
  else if(e.key==='Escape'){if(!helpEl.hidden)setHelp(false);else overview();}
  else if(e.key===' '&&tag!=='BUTTON'&&tag!=='A'&&tag!=='SUMMARY'){playing=!playing;syncPlay();e.preventDefault();}
  else if(e.key==='+'||e.key==='='){zoomBy(.7);}
  else if(e.key==='-'||e.key==='_'){zoomBy(1.43);}
});
const roseEl=document.getElementById('rose');
let skyMode='night';
function bkkHour(){const n=new Date(Date.now()+7*3600e3);return n.getUTCHours()+n.getUTCMinutes()/60;}
const SKY_H={day:12,night:22};
function applySky(){applyTime(skyMode in SKY_H?SKY_H[skyMode]:bkkHour());}
function syncSeg(){document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===skyMode));}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{skyMode=b.dataset.m;lastSkyKey=-1;applySky();syncSeg();try{localStorage.setItem('bkk3dSky',skyMode);}catch(e){}}));
syncSeg();
document.getElementById('compass').addEventListener('click',()=>{
  const off=camera.position.clone().sub(controls.target);const sp=new THREE.Spherical().setFromVector3(off);sp.theta=0;
  flyTo(controls.target.clone(),controls.target.clone().add(new THREE.Vector3().setFromSpherical(sp)));
});
syncPlay();

/* ---------- loop ---------- */
const statusEl=document.getElementById('status');let modeTxt='',lastStatus='',lastP='';const tmp=new THREE.Vector3();let last=performance.now();
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);
function place(list,cls,check){
  const w=stage.clientWidth,h=stage.clientHeight,boxes=[];
  list.forEach(l=>{if(l.hide){l.el.style.display='none';return;}tmp.copy(l.p).project(camera);const vis=tmp.z<1&&tmp.x>-1.1&&tmp.x<1.1&&tmp.y>-1.1&&tmp.y<1.1;
    if(!vis){l.el.style.display='none';return;}
    const x=(tmp.x*.5+.5)*w,y=(-tmp.y*.5+.5)*h;l.el.style.display='';l.el.style.left=x+'px';l.el.style.top=y+'px';
    if(check){const r=l.el.getBoundingClientRect();const bx=[r.left,r.top,r.right,r.bottom];
      if(check.some(o=>!(bx[2]<o[0]||bx[0]>o[2]||bx[3]<o[1]||bx[1]>o[3]))){l.el.style.display='none';return;}check.push(bx);}
  });
}
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(focusTarget&&focusTarget.anim){controls.target.lerp(focusTarget.target,.2);camera.position.lerp(focusTarget.pos,.18);
    if(camera.position.distanceTo(focusTarget.pos)<.05){controls.target.copy(focusTarget.target);camera.position.copy(focusTarget.pos);focusTarget.anim=false;}}
  if(path&&path.total>0){
    if(playing&&!scrubbing){startHL();tPos=(tPos+dt*path.speed)%path.total;}
    if(!scrubbing)scrub.value=Math.round(tPos/path.total*1000);
    {const pv=(tPos/path.total*100).toFixed(1)+'%';if(pv!==lastP){lastP=pv;scrub.style.setProperty('--p',pv);}}
    let i=1;while(i<path.cum.length-1&&path.cum[i]<tPos)i++;
    const a=path.pts[i-1],b=path.pts[i],seg=path.cum[i]-path.cum[i-1]||1;
    traveler.position.copy(a).lerp(b,(tPos-path.cum[i-1])/seg);
    {const dx=b.x-a.x,dz=b.z-a.z;if(dx*dx+dz*dz>1e-10)traveler.children[0].rotation.y=Math.atan2(-dx,-dz);}
    {const H=traveler.children[0],U=H.userData,m=path.modes[i]||'WALK',kind=m==='WALK'?'walk':m==='GRAB'?'car':(m==='BOAT'||m==='CRUISE')?'boat':'rail',key=kind+m;
     if(U.kind!==key){U.kind=key;U.walk.visible=kind==='walk';U.rail.visible=kind==='rail';U.car.visible=kind==='car';U.boat.visible=kind==='boat';
       if(kind==='rail'||kind==='boat'){const bm=U[kind].userData.body;bm.color.set(MODE[m].c);bm.emissive.set(MODE[m].c);}}
     if(kind==='boat'){U.boat.rotation.z=Math.sin(now/900)*.05;U.boat.position.y=Math.sin(now/700)*.06;}
     if(kind==='walk'){const sw=Math.sin(now/170)*.6,L=U.walk.userData.limbs;L[0].rotation.x=sw;L[1].rotation.x=-sw;L[2].rotation.x=-sw*.8;L[3].rotation.x=sw*.8;}}
    if(hl){let si=segInfo.findIndex(S=>i-1>=S.a&&i-1<S.b);if(si<0)si=segInfo.length-1;if(si!==hlSeg){hlSeg=si;applyHL(si);}}
    let li=path.ranges.findIndex(r=>i-1>=r[0]&&i-1<r[1]);if(li<0)li=path.ranges.length-1;
    if(li!==liveLeg){liveLeg=li;document.querySelectorAll('.legrow').forEach(x=>x.classList.toggle('live',+x.dataset.leg===li));
      const all=legsOf(DAYS[curDay]),L=all[li];modeTxt=L?`第 ${li+1}/${all.length} 段　${L.segs.map(s=>MODE[s[0]].sh).filter((v,k,a)=>a.indexOf(v)===k).join(' → ')}　<span>約 ${L.min} 分</span>`:'';}
    let stx=modeTxt||'--';
    if(skyMode==='now'){applySky();const h=bkkHour();stx+=`　<span>曼谷 ${String(Math.floor(h)).padStart(2,'0')}:${String(Math.floor((h%1)*60)).padStart(2,'0')}</span>`;}
    if(stx!==lastStatus){lastStatus=stx;statusEl.innerHTML=stx;}
    {const k=(now/1400)%1;traveler.children[1].scale.setScalar(.6+k*1.1);traveler.children[1].material.opacity=.6*(1-k);}
  }
  controls.update();
  {const cd=camera.position.distanceTo(controls.target);scene.fog.near=cd*2.5;scene.fog.far=cd*9+40;const sr=showStreets&&cd<rdDist;rdLabels.forEach(l=>{l.hide=!sr;});}
  const W=stage.clientWidth,H=stage.clientHeight;
  renderer.setScissorTest(false);renderer.setViewport(0,0,W,H);renderer.render(scene,camera);
  if(false){
    const radarEl=null,radarN=null,rw=radarEl.clientWidth,rh=radarEl.clientHeight,rx=radarEl.offsetLeft+radarEl.clientLeft,ry=H-(radarEl.offsetTop+radarEl.clientTop+rh);
    camera.getWorldDirection(tmp);let fx=tmp.x,fz=tmp.z;const fl=Math.hypot(fx,fz);if(fl<1e-4){fx=0;fz=-1;}else{fx/=fl;fz/=fl;}
    const e=radarExt,ax=rw/rh;rcam.left=-e*ax;rcam.right=e*ax;rcam.top=e;rcam.bottom=-e;rcam.updateProjectionMatrix();
    const tp=traveler.position;rcam.position.set(tp.x,200,tp.z);rcam.up.set(fx,0,fz);rcam.lookAt(tp.x,0,tp.z);
    const fn=scene.fog.near,ff=scene.fog.far;scene.fog.near=1e4;scene.fog.far=1e5;
    renderer.setScissorTest(true);renderer.setScissor(rx,ry,rw,rh);renderer.setViewport(rx,ry,rw,rh);renderer.render(scene,rcam);
    renderer.setScissorTest(false);renderer.setViewport(0,0,W,H);scene.fog.near=fn;scene.fog.far=ff;
    const nx=-fx,ny=-fz,t=Math.min((rw/2)/(Math.abs(nx)||1e-6),(rh/2)/(Math.abs(ny)||1e-6));radarN.style.transform=`translate(${(nx*t).toFixed(1)}px,${(-ny*t).toFixed(1)}px)`;
  }
  roseEl.setAttribute('transform','rotate('+(controls.getAzimuthalAngle()*180/Math.PI)+' 32 32)');
  const occupied=[];place([hotelLabel],'hl',occupied);place(stopLabels,'lb',occupied);place(ttLabels,'tt',occupied);place(stLabels,'st',occupied);sgLabels.forEach(l=>{l.hide=!showSights&&!l.keep;});place(sgLabels,'st',occupied);place(rdLabels,'rd',occupied);
  if(hotelFx){const k=(now/1600)%1;hotelFx.ring.scale.setScalar(1+k*1.6);hotelFx.ring.material.opacity=.6*(1-k);}
  requestAnimationFrame(tick);
}
let start=0;try{const v=+localStorage.getItem('bkk3dDay');if(v>=0&&v<DAYS.length)start=v;}catch(e){}
const hm=(location.hash||'').match(/^#day-(\d)$/);if(hm)start=Math.min(DAYS.length-1,+hm[1]-1);
function clock(){const h=bkkHour();clockEl.textContent='BKK '+String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor((h%1)*60)).padStart(2,'0');}clock();setInterval(clock,20000);
resize();build(start);requestAnimationFrame(tick);
})();
